    const DEFAULT_MEXICO_LINKS_CSV = `Origen,Destino,Peso,Tipo,Sentido

    // ==========================================
    // 3 LECTURA Y PROCESAMIENTO DE CSV
    // ==========================================
    /**
     * Parsea un texto CSV respetando comillas, comas y punto y comas.
     */
    function parseCustomCSV(text) {
      if (!text) return [];
      // Normalización de saltos de línea y eliminación de BOM UTF-8
      const cleanText = text.replace(/^\uFEFF/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
      const lines = cleanText.split('\n').filter(l => l.trim().length > 0);
      if (lines.length === 0) return [];

      // Detectar separador (coma o punto y coma)
      const firstLine = lines[0];
      const separator = (firstLine.split(';').length > firstLine.split(',').length) ? ';' : ',';

      return lines.map(line => {
        const result = [];
        let current = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"' || char === "'") {
            inQuotes = !inQuotes;
          } else if (char === separator && !inQuotes) {
            result.push(current.trim().replace(/^["']|["']$/g, ''));
            current = '';
          } else {
            current += char;
          }
        }
        result.push(current.trim().replace(/^["']|["']$/g, ''));
        return result;
      });
    }

    /**
     * Procesa las matrices del archivo de Nodos y Conexiones.
     */
    function processGraphData(nodesRows, linksRows) {
      state.nodes = [];
      state.links = [];
      state.nodeMap.clear();
      state.categories.clear();

      if (nodesRows.length < 2 || linksRows.length < 2) {
        showNotice("Los archivos proporcionados deben incluir una fila de encabezado y al menos una fila de datos.");
        return;
      }

      // Guardar nombres de columnas
      state.columnsFound.nodes = nodesRows[0];
      state.columnsFound.links = linksRows[0];

      // Determinar presencia de columnas opcionales
      state.hasNodeWeights = nodesRows[0].length >= 3 && nodesRows[0][2].trim() !== "";
      state.hasLinkWeights = linksRows[0].length >= 3 && linksRows[0][2].trim() !== "";
      state.hasLinkType = linksRows[0].length >= 4 && linksRows[0][3].trim() !== "";
      state.hasLinkDirection = linksRows[0].length >= 5 && linksRows[0][4].trim() !== "";

      // 1. Cargar Nodos
      for (let i = 1; i < nodesRows.length; i++) {
        const row = nodesRows[i];
        if (!row[0]) continue; // Omitir fila si nombre está vacío

        const name = row[0].trim();
        const category = row[1] ? row[1].trim() : "General";
        const weight = state.hasNodeWeights ? parseFloat(row[2]) || 1.0 : 1.0;
        
        // Coordenadas geográficas si existen (opcionales)
        const lat = row[3] ? parseFloat(row[3]) : null;
        const lon = row[4] ? parseFloat(row[4]) : null;

        const nodeObj = {
          id: name,
          name: name,
          category: category,
          weight: weight,
          lat: lat,
          lon: lon,
          degree: 0,
          neighbors: new Set()
        };

        state.nodes.push(nodeObj);
        state.nodeMap.set(name, nodeObj);
        state.categories.add(category);
      }

      state.activeCategories = new Set(state.categories);

      // 2. Cargar Conexiones con validaciones
      let missingLinksCount = 0;
      const unknownNodeNames = new Set();

      for (let i = 1; i < linksRows.length; i++) {
        const row = linksRows[i];
        const sourceName = row[0] ? row[0].trim() : "";
        const targetName = row[1] ? row[1].trim() : "";

        // Regla: Si origen o destino están vacíos, omitir fila
        if (!sourceName || !targetName) {
          missingLinksCount++;
          continue;
        }

        // Regla: Verificar existencia en Nodos
        const sourceExists = state.nodeMap.has(sourceName);
        const targetExists = state.nodeMap.has(targetName);

        if (!sourceExists) unknownNodeNames.add(sourceName);
        if (!targetExists) unknownNodeNames.add(targetName);

        if (sourceExists && targetExists) {
          const weight = state.hasLinkWeights ? parseFloat(row[2]) || 1.0 : 1.0;
          const type = state.hasLinkType ? row[3].trim() : "Normal";
          const direction = state.hasLinkDirection ? row[4].trim() : "Ambos";

          const linkObj = {
            source: sourceName, // D3 lo actualizará a referencia de objeto en forceSimulation
            target: targetName,
            sourceId: sourceName,
            targetId: targetName,
            weight: weight,
            type: type,
            direction: direction
          };

          state.links.push(linkObj);

          // Actualizar grados de conexión y vecinos
          const u = state.nodeMap.get(sourceName);
          const v = state.nodeMap.get(targetName);
          u.degree += 1;
          v.degree += 1;
          u.neighbors.add(targetName);
          v.neighbors.add(sourceName);
        }
      }

      // Regla: Contar y gestionar Nodos Aislados
      state.isolatedNodesCount = state.nodes.filter(n => n.degree === 0).length;

      // Generar avisos en interfaz si existen anomalías
      let notices = [];
      if (missingLinksCount > 0) {
        notices.push(`Se omitieron <strong>${missingLinksCount}</strong> fila(s) de conexiones por faltar origen o destino.`);
      }
      if (unknownNodeNames.size > 0) {
        notices.push(`Nombres en conexiones no encontrados en Nodos: <strong>${Array.from(unknownNodeNames).join(', ')}</strong>.`);
      }
      if (state.isolatedNodesCount > 0) {
        notices.push(`Existen <strong>${state.isolatedNodesCount}</strong> nodos sin conexiones (ocultos por defecto).`);
      }

      if (notices.length > 0) {
        showNotice(notices.join('<br>'));
      } else {
        hideNotice();
      }

      updateUIControls();
      renderCurrentMode();
    }

    // ==========================================
    // 5 ESCALAS Y COLORIMETRÍA
    // ==========================================
    /**
     * Obtiene color por categoría asignada o genera uno dinámico
     */
    function getNodeColor(category) {
      if (CATEGORY_COLORS[category]) {
        return CATEGORY_COLORS[category];
      }
      // Si es una categoría nueva de un CSV personalizado, derivar color hash
      let hash = 0;
      for (let i = 0; i < category.length; i++) {
        hash = category.charCodeAt(i) + ((hash << 5) - hash);
      }
      const c = (hash & 0x00FFFFFF).toString(16).toUpperCase();
      return "#" + "00000".substring(0, 6 - c.length) + c;
    }

    /**
     * Escala proporcional para el radio del nodo
     */
    function getNodeRadiusScale() {
      const valueExtent = state.hasNodeWeights 
        ? d3.extent(state.nodes, d => d.weight)
        : d3.extent(state.nodes, d => d.degree);
      
      return d3.scaleSqrt()
        .domain([valueExtent[0] || 1, valueExtent[1] || 10])
        .range([NODE_RADIUS_MIN, NODE_RADIUS_MAX]);
    }

    /**
     * Escala proporcional para el grosor de la línea/conexión
     */
    function getLinkWidthScale() {
      if (!state.hasLinkWeights) return () => 2.0; // Grosor constante por defecto
      const extent = d3.extent(state.links, d => d.weight);
      return d3.scaleLinear()
        .domain([extent[0] || 1, extent[1] || 100])
        .range([LINK_WIDTH_MIN, LINK_WIDTH_MAX]);
    }

    // ==========================================
    // 6 MODOS DE VISUALIZACIÓN & LAYOUTS
    // ==========================================

    /**
     * Filtra nodos y conexiones según las capas y categorías activas
     */
    function getFilteredData() {
      let filteredNodes = state.nodes.filter(n => state.activeCategories.has(n.category));
      
      // Ocultar nodos aislados si la capa no está activa
      if (!state.layers.isolated) {
        filteredNodes = filteredNodes.filter(n => n.degree > 0);
      }

      const activeNodeIds = new Set(filteredNodes.map(n => n.id));

      const filteredLinks = state.links.filter(l => {
        const src = typeof l.source === 'object' ? l.source.id : l.source;
        const tgt = typeof l.target === 'object' ? l.target.id : l.target;
        return activeNodeIds.has(src) && activeNodeIds.has(tgt);
      });

      return { nodes: filteredNodes, links: filteredLinks };
    }

    /**
     * Renderizador principal según el modo seleccionado
     */
    function renderCurrentMode() {
      const svg = d3.select("#network-svg");
      svg.selectAll("*").remove(); // Limpiar lienzo anterior

      const width = svg.node().clientWidth || window.innerWidth;
      const height = svg.node().clientHeight || window.innerHeight;

      // Crear grupo contenedor principal con zoom/pan
      const g = svg.append("g").attr("id", "main-group");

      state.zoomBehavior = d3.zoom()
        .scaleExtent([0.2, 8])
        .on("zoom", (event) => {
          g.attr("transform", event.transform);
        });

      svg.call(state.zoomBehavior);

      // Definir marcadores de flechas para sentido
      svg.append("defs").selectAll("marker")
        .data(["end-arrow", "start-arrow"])
        .enter().append("marker")
        .attr("id", d => d)
        .attr("viewBox", "0 -5 10 10")
        .attr("refX", 18)
        .attr("refY", 0)
        .attr("markerWidth", 6)
        .attr("markerHeight", 6)
        .attr("orient", "auto")
        .append("path")
        .attr("d", d => d === "end-arrow" ? "M0,-5L10,0L0,5" : "M10,-5L0,0L10,5")
        .attr("fill", "#94a3b8");

      const { nodes, links } = getFilteredData();

      if (nodes.length === 0) {
        g.append("text")
          .attr("x", width / 2)
          .attr("y", height / 2)
          .attr("text-anchor", "middle")
          .attr("fill", "#64748b")
          .text("No hay datos visibles con los filtros actuales.");
        return;
      }

      // Detener simulación previa de fuerzas si existe
      if (state.simulation) state.simulation.stop();

      try {
        switch (state.activeMode) {
          case 'map':
            renderMapMode(g, width, height, nodes, links);
            break;
          case 'force':
            renderForceMode(g, width, height, nodes, links);
            break;
          case 'radial':
            renderRadialMode(g, width, height, nodes, links);
            break;
          case 'chord':
            renderChordMode(g, width, height, nodes, links);
            break;
          case 'concentric':
            renderConcentricMode(g, width, height, nodes, links);
            break;
          case 'arc':
            renderArcMode(g, width, height, nodes, links);
            break;
          case 'bipartite':
            renderBipartiteMode(g, width, height, nodes, links);
            break;
          default:
            renderForceMode(g, width, height, nodes, links);
        }
      } catch (err) {
        console.error("Error al renderizar el modo " + state.activeMode, err);
        g.append("text")
          .attr("x", width / 2)
          .attr("y", height / 2)
          .attr("text-anchor", "middle")
          .attr("fill", "#ef4444")
          .text("Ocurrió un error al cargar este modo de visualización.");
      }
    }

    // ----------------------------------------------------
    // MODO 1: MAPA GEOGRÁFICO DE MÉXICO (Ubicaciones Reales)
    // ----------------------------------------------------
    function renderMapMode(g, width, height, nodes, links) {
      // Proyección geoMercator enfocada en la República Mexicana
      const projection = d3.geoMercator()
        .center([-102, 23.5]) // Coordenadas del centro geográfico de México
        .scale(Math.min(width, height) * 1.7)
        .translate([width / 2, height / 2]);

      nodes.forEach(d => {
        if (d.lat && d.lon) {
          const coords = projection([d.lon, d.lat]);
          d.x = coords[0];
          d.y = coords[1];
        } else {
          // Si no tiene coordenadas geográficas, colocar de forma predeterminada
          d.x = width / 2;
          d.y = height / 2;
        }
      });

      drawStandardLinksAndNodes(g, nodes, links);
    }

    // ----------------------------------------------------
    // MODO 2: RED (Force Directed Graph)
    // ----------------------------------------------------
    function renderForceMode(g, width, height, nodes, links) {
      // Copia profunda para evitar mutación de referencias
      const linksCopy = links.map(d => Object.assign({}, d));
      const nodesCopy = nodes.map(d => Object.assign({}, d));

      const rScale = getNodeRadiusScale();

      state.simulation = d3.forceSimulation(nodesCopy)
        .force("link", d3.forceLink(linksCopy).id(d => d.id).distance(90))
        .force("charge", d3.forceManyBody().strength(-240))
        .force("center", d3.forceCenter(width / 2, height / 2))
        .force("collision", d3.forceCollide().radius(d => rScale(state.hasNodeWeights ? d.weight : d.degree) + 8));

      const linkElements = drawLinks(g, linksCopy);
      const nodeElements = drawNodes(g, nodesCopy, true); // Permite arrastrar nodos

      state.simulation.on("tick", () => {
        linkElements
          .attr("x1", d => d.source.x)
          .attr("y1", d => d.source.y)
          .attr("x2", d => d.target.x)
          .attr("y2", d => d.target.y);

        nodeElements.attr("transform", d => `translate(${d.x},${d.y})`);
      });
    }

    // ----------------------------------------------------
    // MODO 3: RADIAL (Nodos en Circunferencia)
    // ----------------------------------------------------
    function renderRadialMode(g, width, height, nodes, links) {
      const radius = Math.min(width, height) * 0.38;
      const centerX = width / 2;
      const centerY = height / 2;
      const angleStep = (2 * Math.PI) / nodes.length;

      const nodePosMap = new Map();

      nodes.forEach((node, i) => {
        const angle = i * angleStep - Math.PI / 2;
        node.x = centerX + radius * Math.cos(angle);
        node.y = centerY + radius * Math.sin(angle);
        nodePosMap.set(node.id, { x: node.x, y: node.y });
      });

      drawStandardLinksAndNodes(g, nodes, links);
    }

    // ----------------------------------------------------
    // MODO 4: CUERDAS (Chord Diagram de Tramos)
    // ----------------------------------------------------
    function renderChordMode(g, width, height, nodes, links) {
      const outerRadius = Math.min(width, height) * 0.4;
      const innerRadius = outerRadius - 20;

      // Construir matriz de adyacencia
      const indexMap = new Map();
      nodes.forEach((n, i) => indexMap.set(n.id, i));
      const matrix = Array(nodes.length).fill(0).map(() => Array(nodes.length).fill(0));

      links.forEach(l => {
        const i = indexMap.get(typeof l.source === 'object' ? l.source.id : l.source);
        const j = indexMap.get(typeof l.target === 'object' ? l.target.id : l.target);
        if (i !== undefined && j !== undefined) {
          const w = l.weight || 1;
          matrix[i][j] += w;
          matrix[j][i] += w;
        }
      });

      const chordLayout = d3.chord().padAngle(0.04)(matrix);
      const chordGroup = g.append("g").attr("transform", `translate(${width / 2},${height / 2})`);

      // Arcos de los nodos
      const arcGenerator = d3.arc().innerRadius(innerRadius).outerRadius(outerRadius);

      const groupG = chordGroup.append("g")
        .selectAll("g")
        .data(chordLayout.groups)
        .enter().append("g");

      groupG.append("path")
        .attr("fill", d => getNodeColor(nodes[d.index].category))
        .attr("stroke", "#0f172a")
        .attr("d", arcGenerator)
        .on("mouseover", (event, d) => showTooltipNode(event, nodes[d.index]))
        .on("mouseout", hideTooltip);

      if (state.layers.labels) {
        groupG.append("text")
          .each(d => { d.angle = (d.startAngle + d.endAngle) / 2; })
          .attr("dy", ".35em")
          .attr("transform", d => `
            rotate(${d.angle * 180 / Math.PI - 90})
            translate(${outerRadius + 10})
            ${d.angle > Math.PI ? "rotate(180)" : ""}
          `)
          .attr("text-anchor", d => d.angle > Math.PI ? "end" : "start")
          .attr("fill", "#cbd5e1")
          .attr("font-size", "10px")
          .text(d => nodes[d.index].name);
      }

      // Cintas / Cuerdas
      if (state.layers.links) {
        const ribbonGenerator = d3.ribbon().radius(innerRadius);
        chordGroup.append("g")
          .attr("fill-opacity", 0.65)
          .selectAll("path")
          .data(chordLayout)
          .enter().append("path")
          .attr("d", ribbonGenerator)
          .attr("fill", d => getNodeColor(nodes[d.source.index].category))
          .attr("stroke", "#0f172a")
          .attr("stroke-width", 0.5)
          .on("mouseover", (event, d) => {
            const src = nodes[d.source.index];
            const tgt = nodes[d.target.index];
            showCustomTooltip(event, `Conexión Cuerda: ${src.name} ↔ ${tgt.name}`, `Volumen/Valor: <strong>${d.source.value}</strong>`);
          })
          .on("mouseout", hideTooltip);
      }
    }

    // ----------------------------------------------------
    // MODO 5: CONCÉNTRICO (Anillos por Peso/Grado)
    // ----------------------------------------------------
    function renderConcentricMode(g, width, height, nodes, links) {
      const centerX = width / 2;
      const centerY = height / 2;

      // Ordenar nodos por importancia (peso o grado)
      const sortedNodes = [...nodes].sort((a, b) => (b.weight || b.degree) - (a.weight || a.degree));
      
      const numRings = 3;
      const ringRadiusStep = Math.min(width, height) * 0.12;

      // Asignar anillo (0 = centro, 1 = medio, 2 = exterior)
      const nodesPerRing = Math.ceil(sortedNodes.length / numRings);
      
      // Dibujar guías de anillos concéntricos
      for (let r = 1; r <= numRings; r++) {
        g.append("circle")
          .attr("cx", centerX)
          .attr("cy", centerY)
          .attr("r", r * ringRadiusStep)
          .attr("fill", "none")
          .attr("stroke", "#334155")
          .attr("stroke-dasharray", "4,4");
      }

      sortedNodes.forEach((node, i) => {
        const ringIndex = Math.min(Math.floor(i / nodesPerRing) + 1, numRings);
        const countInRing = Math.min(nodesPerRing, sortedNodes.length - (ringIndex - 1) * nodesPerRing);
        const indexInRing = i % nodesPerRing;

        const angle = (indexInRing / countInRing) * 2 * Math.PI - Math.PI / 2;
        const currentRadius = ringIndex * ringRadiusStep;

        node.x = centerX + currentRadius * Math.cos(angle);
        node.y = centerY + currentRadius * Math.sin(angle);
      });

      drawStandardLinksAndNodes(g, nodes, links);
    }

    // ----------------------------------------------------
    // MODO 6: ARCO (Arc Diagram Horizontal)
    // ----------------------------------------------------
    function renderArcMode(g, width, height, nodes, links) {
      const margin = 80;
      const startX = margin;
      const endX = width - margin;
      const stepY = height / 2 + 50;

      // Ordenar nodos por categoría o nombre
      const sortedNodes = [...nodes].sort((a, b) => a.category.localeCompare(b.category));
      const stepX = (endX - startX) / Math.max(1, sortedNodes.length - 1);

      const nodePosMap = new Map();
      sortedNodes.forEach((node, i) => {
        node.x = startX + i * stepX;
        node.y = stepY;
        nodePosMap.set(node.id, node);
      });

      // Dibujar enlaces como arcos Bézier superiores
      if (state.layers.links) {
        const linkWidthScale = getLinkWidthScale();
        const linksGroup = g.append("g").attr("class", "links-layer");

        links.forEach(l => {
          const srcId = typeof l.source === 'object' ? l.source.id : l.source;
          const tgtId = typeof l.target === 'object' ? l.target.id : l.target;
          const u = nodePosMap.get(srcId);
          const v = nodePosMap.get(tgtId);

          if (u && v) {
            const x1 = u.x;
            const x2 = v.x;
            const distance = Math.abs(x2 - x1);
            const arcHeight = Math.min(distance * 0.5, height * 0.4);

            const pathD = `M ${x1} ${stepY} A ${distance / 2} ${arcHeight} 0 0 ${x1 < x2 ? 1 : 0} ${x2} ${stepY}`;

            linksGroup.append("path")
              .attr("d", pathD)
              .attr("fill", "none")
              .attr("stroke", getNodeColor(u.category))
              .attr("stroke-width", linkWidthScale(l.weight))
              .attr("stroke-opacity", 0.5)
              .attr("stroke-dasharray", (l.type === "Libre" || l.type === "Punteada") ? DASHED_LINE_ARRAY : null)
              .on("mouseover", (event) => showTooltipLink(event, l))
              .on("mouseout", hideTooltip);
          }
        });
      }

      drawNodes(g, sortedNodes, false);
    }

    // ----------------------------------------------------
    // MODO 7: BIPARTITO EN COLUMNAS (Categorizado)
    // ----------------------------------------------------
    function renderBipartiteMode(g, width, height, nodes, links) {
      const cats = Array.from(state.categories);
      if (cats.length < 2) {
        // Fallback si no hay suficientes categorías diferenciadas
        renderRadialMode(g, width, height, nodes, links);
        return;
      }

      // Dividir nodos entre la primera categoría y el resto
      const col1Category = cats[0];
      const col1Nodes = nodes.filter(n => n.category === col1Category);
      const col2Nodes = nodes.filter(n => n.category !== col1Category);

      const col1X = width * 0.25;
      const col2X = width * 0.75;

      const stepY1 = height / (col1Nodes.length + 1);
      col1Nodes.forEach((node, i) => {
        node.x = col1X;
        node.y = (i + 1) * stepY1;
      });

      const stepY2 = height / (col2Nodes.length + 1);
      col2Nodes.forEach((node, i) => {
        node.x = col2X;
        node.y = (i + 1) * stepY2;
      });

      // Dibujar enlaces como curvas horizontales
      if (state.layers.links) {
        const linkWidthScale = getLinkWidthScale();
        const linksGroup = g.append("g");

        const nodePosMap = new Map(nodes.map(n => [n.id, n]));

        links.forEach(l => {
          const srcId = typeof l.source === 'object' ? l.source.id : l.source;
          const tgtId = typeof l.target === 'object' ? l.target.id : l.target;
          const u = nodePosMap.get(srcId);
          const v = nodePosMap.get(tgtId);

          if (u && v) {
            const linkGen = d3.linkHorizontal()
              .x(d => d.x)
              .y(d => d.y);

            linksGroup.append("path")
              .attr("d", linkGen({ source: u, target: v }))
              .attr("fill", "none")
              .attr("stroke", getNodeColor(u.category))
              .attr("stroke-width", linkWidthScale(l.weight))
              .attr("stroke-opacity", 0.4)
              .on("mouseover", (event) => showTooltipLink(event, l))
              .on("mouseout", hideTooltip);
          }
        });
      }

      drawNodes(g, nodes, false);
    }

    // ==========================================
    // FUNCIONES AUXILIARES DE DIBUJO DE NODOS Y ENLACES
    // ==========================================

    function drawStandardLinksAndNodes(g, nodes, links) {
      const nodePosMap = new Map(nodes.map(n => [n.id, n]));
      
      // Adaptar fuentes y destinos
      const resolvedLinks = links.map(l => {
        const srcId = typeof l.source === 'object' ? l.source.id : l.source;
        const tgtId = typeof l.target === 'object' ? l.target.id : l.target;
        return {
          ...l,
          sourceObj: nodePosMap.get(srcId),
          targetObj: nodePosMap.get(tgtId)
        };
      }).filter(l => l.sourceObj && l.targetObj);

      drawLinksStatic(g, resolvedLinks);
      drawNodes(g, nodes, false);
    }

    function drawLinksStatic(g, links) {
      if (!state.layers.links) return;
      const linkWidthScale = getLinkWidthScale();

      return g.append("g")
        .selectAll("line")
        .data(links)
        .enter().append("line")
        .attr("class", "link-element")
        .attr("x1", d => d.sourceObj.x)
        .attr("y1", d => d.sourceObj.y)
        .attr("x2", d => d.targetObj.x)
        .attr("y2", d => d.targetObj.y)
        .attr("stroke", d => getNodeColor(d.sourceObj.category))
        .attr("stroke-opacity", 0.5)
        .attr("stroke-width", d => linkWidthScale(d.weight))
        .attr("stroke-dasharray", d => (d.type === "Libre" || d.type === "Punteada") ? DASHED_LINE_ARRAY : null)
        .attr("marker-end", d => (state.layers.arrows && (d.direction === "Origen → Destino" || d.direction === "Ambos")) ? "url(#end-arrow)" : null)
        .attr("marker-start", d => (state.layers.arrows && (d.direction === "Destino → Origen" || d.direction === "Ambos")) ? "url(#start-arrow)" : null)
        .on("mouseover", (event, d) => showTooltipLink(event, d))
        .on("mouseout", hideTooltip);
    }

    function drawLinks(g, links) {
      if (!state.layers.links) return g.append("g").selectAll("line");
      const linkWidthScale = getLinkWidthScale();

      return g.append("g")
        .selectAll("line")
        .data(links)
        .enter().append("line")
        .attr("class", "link-element")
        .attr("stroke", d => {
          const cat = typeof d.source === 'object' ? d.source.category : 'General';
          return getNodeColor(cat);
        })
        .attr("stroke-opacity", 0.5)
        .attr("stroke-width", d => linkWidthScale(d.weight))
        .attr("stroke-dasharray", d => (d.type === "Libre" || d.type === "Punteada") ? DASHED_LINE_ARRAY : null)
        .attr("marker-end", d => (state.layers.arrows && (d.direction === "Origen → Destino" || d.direction === "Ambos")) ? "url(#end-arrow)" : null)
        .attr("marker-start", d => (state.layers.arrows && (d.direction === "Destino → Origen" || d.direction === "Ambos")) ? "url(#start-arrow)" : null)
        .on("mouseover", (event, d) => showTooltipLink(event, d))
        .on("mouseout", hideTooltip);
    }

    function drawNodes(g, nodes, enableDrag) {
      if (!state.layers.nodes) return g.append("g").selectAll("g");

      const rScale = getNodeRadiusScale();

      const nodeGroup = g.append("g")
        .selectAll("g")
        .data(nodes)
        .enter().append("g")
        .attr("class", "node-element")
        .attr("transform", d => `translate(${d.x},${d.y})`)
        .on("click", (event, d) => handleNodeClick(event, d))
        .on("mouseover", (event, d) => showTooltipNode(event, d))
        .on("mouseout", hideTooltip);

      // Círculo principal del nodo
      nodeGroup.append("circle")
        .attr("r", d => rScale(state.hasNodeWeights ? d.weight : d.degree))
        .attr("fill", d => getNodeColor(d.category))
        .attr("stroke", "#1e293b")
        .attr("stroke-width", 2)
        .attr("shadow-sm", true);

      // Etiquetas de Texto
      if (state.layers.labels) {
        nodeGroup.append("text")
          .attr("x", d => rScale(state.hasNodeWeights ? d.weight : d.degree) + 4)
          .attr("y", 4)
          .attr("fill", "#f1f5f9")
          .attr("font-size", "11px")
          .attr("font-weight", "500")
          .style("pointer-events", "none")
          .text(d => d.name);
      }

      if (enableDrag && state.simulation) {
        nodeGroup.call(d3.drag()
          .on("start", dragstarted)
          .on("drag", dragged)
          .on("end", dragended));
      }

      return nodeGroup;
    }

    // Acciones de Arrastre para Modo Red
    function dragstarted(event, d) {
      if (!event.active) state.simulation.alphaTarget(0.3).restart();
      d.fx = d.x;
      d.fy = d.y;
    }
    function dragged(event, d) {
      d.fx = event.x;
      d.fy = event.y;
    }
    function dragended(event, d) {
      if (!event.active) state.simulation.alphaTarget(0);
      d.fx = null;
      d.fy = null;
    }

    // ==========================================
    // 7 INTERACCIÓN & RESALTADO (Click & Hover)
    // ==========================================
    function handleNodeClick(event, clickedNode) {
      event.stopPropagation();

      if (state.selectedNode === clickedNode) {
        // Deseleccionar
        state.selectedNode = null;
        d3.selectAll(".node-element").classList?.remove("dimmed");
        d3.selectAll(".node-element, .link-element").classed("dimmed", false);
        return;
      }

      state.selectedNode = clickedNode;

      // Resaltar nodo seleccionado y sus vecinos directos
      d3.selectAll(".node-element").classed("dimmed", d => {
        return d.id !== clickedNode.id && !clickedNode.neighbors.has(d.id);
      });

      d3.selectAll(".link-element").classed("dimmed", d => {
        const srcId = typeof d.source === 'object' ? d.source.id : (d.sourceObj ? d.sourceObj.id : d.source);
        const tgtId = typeof d.target === 'object' ? d.target.id : (d.targetObj ? d.targetObj.id : d.target);
        return srcId !== clickedNode.id && tgtId !== clickedNode.id;
      });
    }

    // Click en el fondo del SVG para limpiar selección
    d3.select("#network-svg").on("click", () => {
      state.selectedNode = null;
      d3.selectAll(".node-element, .link-element").classed("dimmed", false);
    });

    // Tooltip en Nodos
    function showTooltipNode(event, d) {
      const tooltip = d3.select("#tooltip");
      d3.select("#tooltip-title").text(d.name);

      let content = `
        <div><strong>Categoría/Zona:</strong> ${d.category}</div>
        <div><strong>Conexiones (Grado):</strong> ${d.degree}</div>
      `;
      if (state.hasNodeWeights) {
        content += `<div><strong>Peso/Importancia:</strong> ${d.weight}</div>`;
      }
      if (d.lat && d.lon) {
        content += `<div><strong>Ubicación:</strong> ${d.lat.toFixed(2)}°, ${d.lon.toFixed(2)}°</div>`;
      }

      d3.select("#tooltip-body").html(content);

      tooltip
        .style("left", (event.clientX + 15) + "px")
        .style("top", (event.clientY + 15) + "px")
        .style("opacity", 1);
    }

    // Tooltip en Conexiones
    function showTooltipLink(event, d) {
      const tooltip = d3.select("#tooltip");
      const srcName = typeof d.source === 'object' ? d.source.name : (d.sourceObj ? d.sourceObj.name : d.source);
      const tgtName = typeof d.target === 'object' ? d.target.name : (d.targetObj ? d.targetObj.name : d.target);

      d3.select("#tooltip-title").text(`${srcName} ↔ ${tgtName}`);

      let content = `
        <div><strong>Distancia/Peso:</strong> ${d.weight} km</div>
        <div><strong>Tipo de Vía:</strong> ${d.type}</div>
        <div><strong>Sentido:</strong> ${d.direction}</div>
      `;

      d3.select("#tooltip-body").html(content);

      tooltip
        .style("left", (event.clientX + 15) + "px")
        .style("top", (event.clientY + 15) + "px")
        .style("opacity", 1);
    }

    function showCustomTooltip(event, title, bodyHtml) {
      const tooltip = d3.select("#tooltip");
      d3.select("#tooltip-title").text(title);
      d3.select("#tooltip-body").html(bodyHtml);
      tooltip
        .style("left", (event.clientX + 15) + "px")
        .style("top", (event.clientY + 15) + "px")
        .style("opacity", 1);
    }

    function hideTooltip() {
      d3.select("#tooltip").style("opacity", 0);
    }

    // ==========================================
    // 8 INTERFAZ Y CONTROLES HTML
    // ==========================================
    function setMode(modeKey) {
      state.activeMode = modeKey;
      d3.selectAll(".nav-tab")
        .classed("bg-indigo-600 text-white shadow-sm", false)
        .classed("text-slate-400 hover:text-slate-200 hover:bg-slate-800/60", true);

      d3.select(`#btn-${modeKey}`)
        .classed("bg-indigo-600 text-white shadow-sm", true)
        .classed("text-slate-400 hover:text-slate-200 hover:bg-slate-800/60", false);

      renderCurrentMode();
    }

    function toggleLayer(layerKey) {
      const checkbox = document.getElementById(`layer-${layerKey}`);
      if (checkbox) {
        state.layers[layerKey] = checkbox.checked;
        renderCurrentMode();
      }
    }

    function updateUIControls() {
      // Actualizar lista de categorías y sus switches
      const container = d3.select("#categories-list");
      container.html("");

      state.categories.forEach(cat => {
        const color = getNodeColor(cat);
        const count = state.nodes.filter(n => n.category === cat).length;

        const row = container.append("label")
          .attr("class", "flex items-center justify-between p-1.5 rounded-lg hover:bg-slate-800/60 cursor-pointer text-xs text-slate-300");

        const left = row.append("div").attr("class", "flex items-center space-x-2");
        
        left.append("input")
          .attr("type", "checkbox")
          .attr("checked", state.activeCategories.has(cat) ? true : null)
          .attr("class", "rounded border-slate-700 bg-slate-800 text-indigo-600 focus:ring-0")
          .on("change", (e) => {
            if (e.target.checked) state.activeCategories.add(cat);
            else state.activeCategories.delete(cat);
            renderCurrentMode();
          });

        left.append("span")
          .attr("class", "w-2.5 h-2.5 rounded-full inline-block")
          .style("background-color", color);

        left.append("span").text(cat);

        row.append("span")
          .attr("class", "text-[10px] text-slate-500 font-mono")
          .text(count);
      });

      // Actualizar contadores globales
      d3.select("#total-nodes-val").text(state.nodes.length);
      d3.select("#total-links-val").text(state.links.length);
      d3.select("#isolated-count").text(state.isolatedNodesCount);

      const totalKm = state.links.reduce((acc, curr) => acc + (curr.weight || 0), 0);
      d3.select("#total-dist-val").text(`${totalKm.toLocaleString()} km`);
    }

    function toggleAllCategories(enableAll) {
      if (enableAll) {
        state.activeCategories = new Set(state.categories);
      } else {
        state.activeCategories.clear();
      }
      updateUIControls();
      renderCurrentMode();
    }

    function toggleSidebar() {
      const sidebar = document.getElementById("sidebar");
      sidebar.classList.toggle("-ml-72");
    }

    function showNotice(msgHtml) {
      d3.select("#notice-content").html(msgHtml);
      d3.select("#notice-banner").classed("hidden", false);
    }

    function hideNotice() {
      d3.select("#notice-banner").classed("hidden", true);
    }

    // Gestión de Carga de Archivos CSV
    let tempNodesCSV = null;
    let tempLinksCSV = null;

    function handleFileSelect(event, fileType) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const text = e.target.result;
        const parsedRows = parseCustomCSV(text);

        if (fileType === 'nodes') {
          tempNodesCSV = parsedRows;
        } else if (fileType === 'links') {
          tempLinksCSV = parsedRows;
        }

        // Si ambos archivos han sido cargados o se reemplaza uno manteniendo el otro
        const nodesToUse = tempNodesCSV || parseCustomCSV(DEFAULT_MEXICO_NODES_CSV);
        const linksToUse = tempLinksCSV || parseCustomCSV(DEFAULT_MEXICO_LINKS_CSV);

        processGraphData(nodesToUse, linksToUse);
      };
      reader.readAsText(file, "UTF-8");
    }

    // Generador de plantillas CSV para pruebas del usuario
    function exportCSVTemplates() {
      const blobNodes = new Blob([DEFAULT_MEXICO_NODES_CSV], { type: 'text/csv;charset=utf-8;' });
      const blobLinks = new Blob([DEFAULT_MEXICO_LINKS_CSV], { type: 'text/csv;charset=utf-8;' });
      
      const link1 = document.createElement("a");
      link1.href = URL.createObjectURL(blobNodes);
      link1.download = "Puntos_Capitales.csv";
      link1.click();

      setTimeout(() => {
        const link2 = document.createElement("a");
        link2.href = URL.createObjectURL(blobLinks);
        link2.download = "Conexiones_Carreteras.csv";
        link2.click();
      }, 300);
    }

    // Zoom Controls
    function zoomIn() {
      d3.select("#network-svg").transition().duration(300).call(state.zoomBehavior.scaleBy, 1.3);
    }
    function zoomOut() {
      d3.select("#network-svg").transition().duration(300).call(state.zoomBehavior.scaleBy, 0.7);
    }
    function resetZoom() {
      d3.select("#network-svg").transition().duration(300).call(state.zoomBehavior.transform, d3.zoomIdentity);
    }

    // Redimensionamiento Adaptativo de Ventana
    window.addEventListener("resize", () => {
      renderCurrentMode();
    });

    // ==========================================
    // 9 INICIO DE LA APLICACIÓN
    // ==========================================
    window.onload = function() {
      // Cargar datos predeterminados de la Red Vial de México al iniciar
      const initialNodes = parseCustomCSV(DEFAULT_MEXICO_NODES_CSV);
      const initialLinks = parseCustomCSV(DEFAULT_MEXICO_LINKS_CSV);
      processGraphData(initialNodes, initialLinks);
    };
  </script>
</body>
</html>
